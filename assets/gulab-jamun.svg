<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Glistening Golden Brown Jamun Radial Gradient -->
    <radialGradient id="jamunGrad1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#b45309"/>
      <stop offset="65%" stop-color="#78350f"/>
      <stop offset="90%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#260e02"/>
    </radialGradient>
    <radialGradient id="jamunGrad2" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#602506"/>
      <stop offset="100%" stop-color="#1f0901"/>
    </radialGradient>
    <!-- Sugar Syrup Glow -->
    <radialGradient id="syrupPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="jamunShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#3b1104" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#jamunShadow)">
    <!-- Syrup Base Puddle -->
    <ellipse cx="100" cy="148" rx="80" ry="24" fill="url(#syrupPool)"/>

    <!-- Jamun 2 (Back / Right) -->
    <circle cx="128" cy="100" r="42" fill="url(#jamunGrad2)"/>
    <!-- Jamun 2 Highlight -->
    <ellipse cx="118" cy="85" rx="14" ry="7" transform="rotate(-30 118 85)" fill="#ffffff" opacity="0.32"/>

    <!-- Jamun 1 (Front / Left) -->
    <circle cx="75" cy="112" r="50" fill="url(#jamunGrad1)"/>
    <!-- Jamun 1 Glossy Syrup Specular Highlights -->
    <ellipse cx="60" cy="90" rx="18" ry="9" transform="rotate(-25 60 90)" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="52" cy="82" rx="6" ry="3" transform="rotate(-25 52 82)" fill="#ffffff" opacity="0.75"/>
    <circle cx="95" cy="130" r="3" fill="#ffffff" opacity="0.3"/>

    <!-- Glistening Syrup Droplets -->
    <ellipse cx="105" cy="145" rx="14" ry="5" fill="#fef08a" opacity="0.5"/>

    <!-- Pistachio Slivers Garnish (Green) -->
    <path d="M 68 85 C 72 82, 78 84, 79 88 C 76 90, 71 88, 68 85 Z" fill="#4ade80"/>
    <path d="M 70 86 C 73 84, 76 85, 77 87" stroke="#166534" stroke-width="0.8"/>
    <path d="M 85 95 C 89 92, 94 94, 95 98 C 92 100, 88 98, 85 95 Z" fill="#86efac"/>
    <!-- Saffron Strands (Deep Orange-Red) -->
    <path d="M 55 98 Q 62 104 68 102" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 120 90 Q 126 95 132 92" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
