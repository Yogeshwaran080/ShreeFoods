<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Crisp Golden Appalam Gradient -->
    <radialGradient id="appalamGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="appalamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="9" stdDeviation="11" flood-color="#78350f" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#appalamShadow)">
    <!-- Wavy Crunchy Fried Appalam Disc -->
    <path d="M 100 15 
             C 145 13, 184 48, 185 96 
             C 186 148, 149 184, 98 185 
             C 47 186, 14 146, 15 98 
             C 16 46, 52 17, 100 15 Z" 
          fill="url(#appalamGrad)" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Fried Crunchy Bubbles (The signature appalam puffed blisters) -->
    <!-- Bubble 1 -->
    <ellipse cx="65" cy="60" rx="14" ry="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="63" cy="58" rx="8" ry="5" fill="#ffffff" opacity="0.7"/>
    <!-- Bubble 2 -->
    <ellipse cx="125" cy="55" rx="16" ry="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <ellipse cx="122" cy="53" rx="9" ry="6" fill="#ffffff" opacity="0.6"/>
    <!-- Bubble 3 -->
    <ellipse cx="140" cy="115" rx="18" ry="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <ellipse cx="137" cy="112" rx="10" ry="7" fill="#ffffff" opacity="0.7"/>
    <!-- Bubble 4 -->
    <ellipse cx="60" cy="125" rx="15" ry="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <!-- Bubble 5 Center -->
    <ellipse cx="98" cy="98" rx="20" ry="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
    <ellipse cx="95" cy="95" rx="12" ry="8" fill="#ffffff" opacity="0.8"/>

    <!-- Tiny crispy fried pores -->
    <circle cx="85" cy="40" r="2.5" fill="#b45309" opacity="0.5"/>
    <circle cx="110" cy="42" r="2" fill="#b45309" opacity="0.4"/>
    <circle cx="45" cy="90" r="3" fill="#b45309" opacity="0.5"/>
    <circle cx="155" cy="85" r="2.5" fill="#b45309" opacity="0.4"/>
    <circle cx="90" cy="145" r="3" fill="#b45309" opacity="0.45"/>
    <circle cx="120" cy="148" r="2.5" fill="#b45309" opacity="0.5"/>

    <!-- Edge Crunch Curves -->
    <path d="M 35 65 Q 45 68 55 60" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 135 150 Q 145 145 155 152" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
