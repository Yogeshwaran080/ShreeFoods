<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <defs>
    <!-- 3D Gradients -->
    <radialGradient id="faceGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fdba74"/>
      <stop offset="90%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <linearGradient id="chefApron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chefCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="glowRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
    <filter id="avatarDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#avatarDrop)">
    <!-- Trust Halo Background -->
    <circle cx="120" cy="130" r="110" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="120" cy="130" r="102" fill="url(#glowRing)"/>

    <!-- Hair Bun (Traditional Kondai with Jasmine Mallipoo Flowers) -->
    <circle cx="120" cy="65" r="48" fill="#18181b"/>
    <!-- Jasmine Garland (Mallipoo) around bun -->
    <g fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8">
      <circle cx="85" cy="55" r="6"/>
      <circle cx="95" cy="45" r="6.5"/>
      <circle cx="110" cy="40" r="7"/>
      <circle cx="128" cy="40" r="7"/>
      <circle cx="144" cy="46" r="6.5"/>
      <circle cx="154" cy="57" r="6"/>
    </g>

    <!-- Chef Cap/Toque modern hybrid band -->
    <path d="M 82 58 Q 120 48 158 58 Q 155 70 85 70 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Ears -->
    <ellipse cx="74" cy="108" rx="8" ry="12" fill="#fdba74"/>
    <ellipse cx="166" cy="108" rx="8" ry="12" fill="#fdba74"/>
    <!-- Gold Jimikki Earrings -->
    <circle cx="73" cy="120" r="4" fill="#fbbf24"/>
    <path d="M 70 122 L 76 122 L 74 128 L 72 128 Z" fill="#f59e0b"/>
    <circle cx="167" cy="120" r="4" fill="#fbbf24"/>
    <path d="M 164 122 L 170 122 L 168 128 L 166 128 Z" fill="#f59e0b"/>

    <!-- 3D Friendly Face -->
    <ellipse cx="120" cy="105" rx="46" ry="50" fill="url(#faceGrad)"/>

    <!-- Eyes (Warm & Smiling) -->
    <ellipse cx="102" cy="98" rx="7" ry="5" fill="#1c1917"/>
    <circle cx="104" cy="96" r="2" fill="#ffffff"/>
    <path d="M 94 90 Q 102 85 110 90" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>

    <ellipse cx="138" cy="98" rx="7" ry="5" fill="#1c1917"/>
    <circle cx="140" cy="96" r="2" fill="#ffffff"/>
    <path d="M 130 90 Q 138 85 146 90" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Red Pottu / Bindi -->
    <circle cx="120" cy="85" r="4" fill="#dc2626"/>

    <!-- Nose -->
    <path d="M 119 98 Q 123 107 117 110 Q 121 111 124 109" stroke="#ea580c" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Warm Cheerful Smile -->
    <path d="M 104 122 Q 120 136 136 122" stroke="#991b1b" stroke-width="3" fill="#f87171" stroke-linecap="round"/>
    <path d="M 110 123 Q 120 128 130 123" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="92" cy="115" r="8" fill="#f87171" opacity="0.35"/>
    <circle cx="148" cy="115" r="8" fill="#f87171" opacity="0.35"/>

    <!-- Neck & Gold Chain / Mangalsutra hint -->
    <path d="M 108 145 L 108 165 L 132 165 L 132 145 Z" fill="#fdba74"/>
    <path d="M 108 156 Q 120 166 132 156" stroke="#fbbf24" stroke-width="2" fill="none"/>

    <!-- White Chef Coat / Apron with Green Trim -->
    <path d="M 68 185 C 72 165, 102 162, 120 162 C 138 162, 168 165, 172 185 L 180 250 L 60 250 Z" 
          fill="url(#chefApron)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Green Stand Collar -->
    <path d="M 98 164 L 120 178 L 142 164 L 140 172 L 120 186 L 100 172 Z" fill="url(#chefCollar)"/>

    <!-- Chef Buttons (Green) -->
    <circle cx="120" cy="198" r="4" fill="#15803d"/>
    <circle cx="120" cy="216" r="4" fill="#15803d"/>
    <circle cx="120" cy="234" r="4" fill="#15803d"/>

    <!-- Right Hand Giving Thumbs Up! -->
    <g transform="translate(150, 170)">
      <!-- Palm -->
      <ellipse cx="25" cy="28" rx="14" ry="12" fill="#fdba74"/>
      <!-- Thumbs Up Finger -->
      <path d="M 22 24 C 20 10, 28 6, 32 12 C 34 16, 30 24, 26 26 Z" fill="#fdba74" stroke="#ea580c" stroke-width="1"/>
      <path d="M 28 8 Q 30 6 32 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <!-- Folded Fingers -->
      <path d="M 16 26 C 14 28, 14 36, 20 38 C 26 38, 28 32, 26 28" fill="#fb923c"/>
      <path d="M 12 32 C 10 35, 12 42, 18 43 C 24 43, 26 38, 24 34" fill="#f97316"/>
    </g>

    <!-- Trust Badge Floating Pill -->
    <g transform="translate(45, 235)">
      <rect width="150" height="30" rx="15" fill="#15803d" stroke="#86efac" stroke-width="1.5"/>
      <circle cx="20" cy="15" r="8" fill="#22c55e"/>
      <path d="M 16 15 L 19 18 L 25 12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="19" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">CHEF LAKSHMI</text>
    </g>
  </g>
</svg>
