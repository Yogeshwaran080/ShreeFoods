<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Playfair+Display:ital,wght@1,600;1,700&amp;family=Cormorant+Garamond:wght@600;700&amp;display=swap');
      .logo-tamil {
        font-family: 'Anek Tamil', 'Noto Sans Tamil', 'Latha', 'Mukta Malar', serif;
        font-size: 34px;
        font-weight: 900;
        fill: #ffffff;
        filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.45));
      }
      .logo-brand-curvy {
        font-family: 'Alex Brush', 'Playfair Display', 'Brush Script MT', 'Lucida Calligraphy', cursive, serif;
        font-size: 38px;
        font-weight: 700;
        fill: #14532d;
        filter: drop-shadow(0.5px 1px 1px rgba(20,83,45,0.15));
      }
      .logo-sub-classy {
        font-family: 'Cormorant Garamond', 'Playfair Display', 'Georgia', serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 5px;
        fill: #15803d;
      }
    </style>
    <linearGradient id="leafGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="leafVein" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#052e16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Banana Leaf Emblem -->
  <g filter="url(#shadow)">
    <!-- Leaf Body -->
    <path d="M 12 45 C 16 18, 48 8, 82 14 C 95 30, 96 60, 80 74 C 44 82, 16 72, 12 45 Z" fill="url(#leafGrad)"/>
    
    <!-- Natural Leaf Spine (Center Vein) -->
    <path d="M 12 45 Q 48 44 86 44" stroke="url(#leafVein)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Secondary Veins -->
    <path d="M 28 43 Q 36 28 46 21" stroke="#86efac" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 44 44 Q 54 27 66 22" stroke="#86efac" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 60 44 Q 68 31 77 28" stroke="#86efac" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 28 45 Q 36 59 46 66" stroke="#86efac" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 44 44 Q 54 61 66 67" stroke="#86efac" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 60 44 Q 68 58 77 62" stroke="#86efac" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Gold Accent Border around leaf -->
    <path d="M 12 45 C 16 18, 48 8, 82 14 C 95 30, 96 60, 80 74 C 44 82, 16 72, 12 45 Z" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Tamil Symbol "ஸ்ரீ" inside Leaf -->
    <text x="49" y="56" 
          class="logo-tamil"
          text-anchor="middle">ஸ்ரீ</text>
  </g>

  <!-- Curvy & Classy Brand Typography: Sri Lakshmi HomeFood -->
  <g transform="translate(102, 16)">
    <!-- Curvy Calligraphic Script: Sri Lakshmi -->
    <text x="0" y="36" class="logo-brand-curvy">Sri Lakshmi</text>
    
    <!-- Classy Spaced Serif Subtitle: HOMEFOOD -->
    <text x="3" y="56" class="logo-sub-classy">HOMEFOOD</text>
  </g>
</svg>
